name: Prototype validation and Chromium package

on:
  push:
    branches:
      - feat/prototype-alpha-20261013
      - feat/apdf-45-save-workflow
      - feat/apdf-core-editor-print-text
      - feat/apdf-19-printer-capabilities
      - feat/apdf-22-reopen-edit-annotations
      - fix/apdf-desktop-open-pdf-hotfix
      - fix/apdf-52-win32-open-dialog-filter
      - feat/apdf-usability-view-modes-markup-drag
      - feat/apdf-56-markup-controls-performance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apdf-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    name: Typecheck, test, build extension
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify types
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Bundle Chromium extension
        run: pnpm build:extension
      - name: Validate generated Manifest V3 package
        run: node tools/check-extension-package.mjs
      - name: Install Chromium for browser integration test
        run: pnpm exec playwright install --with-deps chromium
      - name: Regression test Windows desktop Open PDF fallback
        run: |
          set -eu
          pnpm --filter @axik/desktop dev:web >/tmp/axik-desktop-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" || true' EXIT
          READY=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:1420/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/axik-desktop-vite.log
            exit 1
          fi
          pnpm exec playwright test test/desktop-web/desktop-open.spec.ts --workers=1 --reporter=line
      - name: Test extension in actual Chromium
        run: pnpm test:e2e
      - name: Package prototype
        run: |
          cd apps/chromium-extension/dist
          zip -qr ../../../axik-pdf-chromium-prototype.zip .
      - name: Upload installable prototype
        uses: actions/upload-artifact@v4
        with:
          name: axik-pdf-chromium-prototype
          path: axik-pdf-chromium-prototype.zip
          if-no-files-found: error
          retention-days: 14
